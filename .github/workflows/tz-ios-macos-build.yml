name: TZ iOS arm64 unsigned candidate

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Numeric internal build number
        required: true
        default: "100011"
        type: string
      acknowledge_not_installable:
        description: I understand the output is unsigned and requires complete Apple signing
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "1.0.11"

permissions:
  contents: write

concurrency:
  group: tz-ios-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.ref_type == 'tag' || inputs.acknowledge_not_installable == true }}
    runs-on: macos-26
    timeout-minutes: 360
    env:
      TZ_UPSTREAM_SHA: 6ad963e5b62d354da79040f388ae2b9132fb17b8
      TZ_EXPECTED_XCODE: "26.2"
      TZ_EXPECTED_BAZEL: "8.4.2"
      TZ_EXPECTED_BAZEL_SHA256: 45e9388abf21d1107e146ea366ad080eb93cb6a5f3a4a3b048f78de0bc3faffa
      TZ_EXPECTED_APP_VERSION: "1.0.11"
      TZ_EXPECTED_BUNDLE_ID: com.tianze.tz
      TZ_BUILD_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.build_number || '100011' }}
      BAZEL_BINARY: ${{ github.workspace }}/build-input/bazel-8.4.2-darwin-arm64
      TZ_IOS_API_ID: ${{ secrets.TZ_IOS_API_ID }}
      TZ_IOS_API_HASH: ${{ secrets.TZ_IOS_API_HASH }}

    steps:
      - name: Check out the TZ source snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Define runner-local private paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "BAZEL_USER_ROOT=$RUNNER_TEMP/tz-bazel-user-root"
            echo "BAZEL_TOOL_CACHE=$RUNNER_TEMP/tz-bazel-tool-cache"
            echo "TZ_BUILD_OUTPUT=$RUNNER_TEMP/tz-build-output"
            echo "TZ_VERIFIED_OUTPUT=$RUNNER_TEMP/tz-verified-output"
            echo "TZ_RELEASE_OUTPUT=$RUNNER_TEMP/tz-release-output"
            echo "TZ_BUILD_CONFIG=$RUNNER_TEMP/tz-ios-build-configuration.json"
            echo "TZ_FAKE_SIGNING=$RUNNER_TEMP/tz-fake-signing"
          } >> "$GITHUB_ENV"

      - name: Enforce locked upstream ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git config --get remote.origin.url)" != "https://github.com/TelegramMessenger/Telegram-iOS.git"
          test "$(python3 -c 'import json; print(json.load(open("TZ_UPSTREAM.lock"))["commit"])')" = "$TZ_UPSTREAM_SHA"
          git cat-file -e "$TZ_UPSTREAM_SHA^{commit}"
          git merge-base --is-ancestor "$TZ_UPSTREAM_SHA" HEAD
          git submodule status --recursive | tee "$RUNNER_TEMP/submodules.txt"
          if grep -Eq '^[+-U]' "$RUNNER_TEMP/submodules.txt"; then
            echo "submodule checkout does not match the superproject gitlinks" >&2
            exit 1
          fi

      - name: Validate required secrets without disclosing them
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TZ_IOS_API_ID"
          test -n "$TZ_IOS_API_HASH"
          echo "::add-mask::$TZ_IOS_API_ID"
          echo "::add-mask::$TZ_IOS_API_HASH"
          [[ "$TZ_BUILD_NUMBER" =~ ^[0-9]+$ ]]

      - name: Select the upstream-required Xcode exactly
        shell: bash
        run: |
          set -euo pipefail
          required_xcode="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          required_macos="$(python3 -c 'import json; print(json.load(open("versions.json"))["macos"])')"
          required_bazel="$(python3 -c 'import json; print(json.load(open("versions.json"))["bazel"].split(":", 1)[0])')"
          test "$required_xcode" = "$TZ_EXPECTED_XCODE"
          test "$required_macos" = "26"
          test "$required_bazel" = "$TZ_EXPECTED_BAZEL"
          sudo xcode-select -s "/Applications/Xcode_${TZ_EXPECTED_XCODE}.app/Contents/Developer"
          test "$(xcodebuild -version | awk 'NR==1 {print $2}')" = "$TZ_EXPECTED_XCODE"
          sw_vers
          xcodebuild -version
          df -h /

      - name: Enforce TZ source, bundle, brand, gateway, and entitlement gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tz_ios_verify_source.py

      - name: Render secret build configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/tz_ios_render_build_config.py "$TZ_BUILD_CONFIG"

      - name: Restore the content-addressed Bazel executable cache
        id: cache_restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/tz-bazel-tool-cache
          key: tz-bazel-tool-${{ runner.os }}-${{ runner.arch }}-8.4.2-45e9388abf21d1107e146ea366ad080eb93cb6a5f3a4a3b048f78de0bc3faffa

      - name: Resolve and verify the exact Bazel executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BAZEL_TOOL_CACHE"
          test ! -L "$BAZEL_TOOL_CACHE"
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, "build-system/Make")
          from BazelLocation import locate_bazel
          resolved = locate_bazel(os.getcwd(), None, os.environ["BAZEL_TOOL_CACHE"])
          if os.path.realpath(resolved) != os.path.realpath(os.environ["BAZEL_BINARY"]):
              raise SystemExit("unexpected Bazel binary path")
          PY
          actual_bazel_sha="$(shasum -a 256 "$BAZEL_BINARY" | awk '{print $1}')"
          test "$actual_bazel_sha" = "$TZ_EXPECTED_BAZEL_SHA256"
          test "$($BAZEL_BINARY --version | awk '{print $2}')" = "$TZ_EXPECTED_BAZEL"
          printf 'cache_hit=%s\n' '${{ steps.cache_restore.outputs.cache-hit }}' > "$RUNNER_TEMP/cache-state.txt"
          shasum -a 256 "$BAZEL_BINARY" versions.json > "$RUNNER_TEMP/cache-inputs.sha256"
          cat "$RUNNER_TEMP/cache-state.txt"
          cat "$RUNNER_TEMP/cache-inputs.sha256"

      - name: Prepare TZ-specific self-signed fake profiles
        shell: bash
        run: |
          set -euo pipefail
          test "$(shasum -a 256 build-system/fake-codesigning/certs/Public.cer | awk '{print $1}')" = "eccdeb43dd50f4abdadf0dc6204c314298c16005567fcbf5d0a20a5761a93ba4"
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 scripts/tz_ios_prepare_fake_signing.py \
            --source build-system/fake-codesigning \
            --output "$TZ_FAKE_SIGNING"
          profile_plist="$RUNNER_TEMP/fake-profile.plist"
          security cms -D -i "$TZ_FAKE_SIGNING/profiles/Telegram.mobileprovision" > "$profile_plist"
          python3 - "$profile_plist" <<'PY'
          import datetime
          import plistlib
          import sys
          with open(sys.argv[1], "rb") as stream:
              profile = plistlib.load(stream)
          expiration = profile["ExpirationDate"]
          now = datetime.datetime.now(datetime.timezone.utc)
          if expiration.replace(tzinfo=datetime.timezone.utc) <= now:
              raise SystemExit("locked upstream fake provisioning profile is expired")
          print(f"fake profile expiration verified: {expiration.isoformat()}Z")
          PY

      - name: Build release_arm64 with fake signing
        id: build_app
        shell: bash
        run: |
          set -uo pipefail
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --bazel="$BAZEL_BINARY" \
            build \
            --configurationPath="$TZ_BUILD_CONFIG" \
            --codesigningInformationPath="$TZ_FAKE_SIGNING" \
            --configuration=release_arm64 \
            --disableExtensions \
            --disablePushNotifications \
            --buildNumber="$TZ_BUILD_NUMBER" \
            --outputBuildArtifactsPath="$TZ_BUILD_OUTPUT" \
            --lock \
            2>&1 | tee "$RUNNER_TEMP/tz-ios-build.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Report the first real build error
        if: ${{ failure() && steps.build_app.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          first_error="$(python3 scripts/tz_ios_extract_first_error.py "$RUNNER_TEMP/tz-ios-build.log")"
          printf '### First real build error\n\n```text\n%s\n```\n' "$first_error" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$first_error" >&2

      - name: Verify IPA structure, arm64, TZ identity, endpoint, and fake signature
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tz_ios_verify_ipa.py "$TZ_BUILD_OUTPUT/Telegram.ipa" "$TZ_VERIFIED_OUTPUT"
          cp TZ_UPSTREAM.lock "$TZ_VERIFIED_OUTPUT/"
          cp TZ_IOS_IDENTITIES.json "$TZ_VERIFIED_OUTPUT/"
          cp "$RUNNER_TEMP/submodules.txt" "$TZ_VERIFIED_OUTPUT/SUBMODULES.txt"
          cp "$RUNNER_TEMP/cache-state.txt" "$TZ_VERIFIED_OUTPUT/CACHE_STATE.txt"
          cp "$RUNNER_TEMP/cache-inputs.sha256" "$TZ_VERIFIED_OUTPUT/CACHE_INPUTS_SHA256.txt"
          git rev-parse HEAD > "$TZ_VERIFIED_OUTPUT/TZ_SOURCE_COMMIT.txt"
          printf '%s\n' \
            'NOT DIRECTLY INSTALLABLE' \
            'Fake self-signed certificate and temporary TZ bundle identity.' \
            'Every app and extension must be re-signed with matching identifiers, entitlements, and profiles.' \
            'Installation and runtime were not executed by this workflow.' \
            > "$TZ_VERIFIED_OUTPUT/REQUIRES_FULL_RESIGN.txt"
          (cd "$TZ_VERIFIED_OUTPUT" && shasum -a 256 -c SHA256SUMS.txt)

      - name: Produce the unsigned signing-platform package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TZ_RELEASE_OUTPUT"
          python3 scripts/tz_ios_make_unsigned_ipa.py \
            "$TZ_VERIFIED_OUTPUT/TZ-1.0.11-ios-arm64-REQUIRES-FULL-RESIGN.ipa" \
            "$TZ_RELEASE_OUTPUT/TZ-1.0.11-ios-arm64-UNSIGNED.ipa" \
            "$TZ_RELEASE_OUTPUT/UNSIGNED_IPA_VERIFICATION.json" \
            --preserve-provisioning-profiles
          python3 - "$TZ_RELEASE_OUTPUT/UNSIGNED_IPA_VERIFICATION.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              report = json.load(stream)
          if report.get("provisioning_profiles_preserved") != 1:
              raise SystemExit("the single-target IPA must retain exactly one profile template")
          if report.get("signature_status") != "UNSIGNED_REQUIRES_COMPLETE_APPLE_RESIGN_NOT_DIRECTLY_INSTALLABLE":
              raise SystemExit("unexpected unsigned package status")
          PY
          for metadata in \
            IPA_STATIC_VERIFICATION.json TZ_UPSTREAM.lock TZ_IOS_IDENTITIES.json \
            SUBMODULES.txt CACHE_STATE.txt CACHE_INPUTS_SHA256.txt TZ_SOURCE_COMMIT.txt; do
            cp "$TZ_VERIFIED_OUTPUT/$metadata" "$TZ_RELEASE_OUTPUT/$metadata"
          done
          unsigned_sha="$(shasum -a 256 "$TZ_RELEASE_OUTPUT/TZ-1.0.11-ios-arm64-UNSIGNED.ipa" | awk '{print $1}')"
          printf '%s  %s\n' "$unsigned_sha" 'TZ-1.0.11-ios-arm64-UNSIGNED.ipa' \
            > "$TZ_RELEASE_OUTPUT/SHA256SUMS-UNSIGNED.txt"
          cat > "$TZ_RELEASE_OUTPUT/UNSIGNED-REQUIRES-APPLE-SIGNING.txt" <<'EOF'
          UNSIGNED IPA - NOT DIRECTLY INSTALLABLE

          This is a single-target IPA. It contains no Share, Widget, notification, Siri, broadcast,
          or Watch extensions and requests no App Group, APNs, or Associated Domains entitlement.
          The signing service must replace the one temporary profile template and completely sign
          the main app, every framework, and every nested executable.
          EOF

      - name: Save the Bazel executable cache only after the IPA passes all gates
        if: ${{ success() && steps.cache_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/tz-bazel-tool-cache
          key: tz-bazel-tool-${{ runner.os }}-${{ runner.arch }}-8.4.2-45e9388abf21d1107e146ea366ad080eb93cb6a5f3a4a3b048f78de0bc3faffa

      - name: Upload the gated unsigned candidate
        id: upload_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TZ-1.0.11-ios-arm64-UNSIGNED-${{ github.sha }}
          path: ${{ runner.temp }}/tz-release-output
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" "$TZ_RELEASE_OUTPUT"/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "TZ iOS 1.0.11" \
            --notes "TZ iOS 1.0.11：延续 1.0.10 纯单体客户端和自身沙盒方案；修复登录密码页面错误文案，并修复首次启动虽然设置显示简体中文、界面却仍为英语的问题。通知功能按当前发行策略暂不启用。界面中的旧 Telesrv 品牌文字由配套 TZ Server 语言包统一刷新。Release 提供保留一份描述文件模板的无签名 IPA，仍须使用有效 Apple 证书完整重签名。"

      - name: State the exact completion boundary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Candidate artifact uploaded'
            echo
            echo "Artifact ID: ${{ steps.upload_candidate.outputs.artifact-id }}"
            echo "Artifact URL: ${{ steps.upload_candidate.outputs.artifact-url }}"
            echo
            echo 'This is an unsigned Actions artifact, not a GitHub Release.'
            echo 'It requires complete Apple signing and was not installed or run by Actions.'
          } >> "$GITHUB_STEP_SUMMARY"
